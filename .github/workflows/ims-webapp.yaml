name: Inventory Management System

on:
  push:
    branches:
      - main
      - features/**
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.x.x"

permissions:
  contents: read

jobs:
  test:
    name: Run unit test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Checkout template repository
        uses: actions/checkout@v5
        with:
          repository: Jack20001413/github-workflow-templates
          ref: main
          path: templates

      - uses: ./templates/.github/actions/dotnet-restore
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          project-directory: ${{ github.workspace }}/CoffeeShopIMS.Test

      - name: Run unit tests
        run: dotnet test ${{ github.workspace }}/CoffeeShopIMS.Test --no-restore --logger trx --results-directory ${{ github.workspace }}/CoffeeShopIMS.Test/TestResults

      - name: Debug test result directory
        run: ls -aR ${{ github.workspace }}/CoffeeShopIMS.Test

      # - name: Report test results
      #   uses: dorny/test-reporter@v2
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: Unit Tests
      #     path: ${{ github.workspace }}/CoffeeShopIMS.Test/TestResults/*.trx
      #     reporter: dotnet-trx

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/CoffeeShopIMS.Test/TestResults

  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: true

      # This is an attempt to centralize common sets of actions in a template repo. Because GitHub does not support creating templates for actions yet, so I have to make this workaround to allow centralizing action templates.
      - name: Checkout template repository
        uses: actions/checkout@v5
        with:
          repository: Jack20001413/github-workflow-templates
          ref: main
          path: templates

      - uses: ./templates/.github/actions/dotnet-restore
        with:
          dotnet-version: ${{ env.DOTNET_VERSION}}
          project-directory: ${{ github.workspace }}/CoffeeShopIMS

      - name: Build project
        run: dotnet build ${{ github.workspace }}/CoffeeShopIMS --no-restore -c Release

      - name: Publish project
        run: dotnet publish ${{ github.workspace }}/CoffeeShopIMS --no-build --output ${{ github.workspace }}/CoffeeShopIMS/.out

      - name: Upload pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/CoffeeShopIMS/.out
          include-hidden-files: true

  deploy:
    name: Deploy application to DEV
    permissions:
      id-token: write
      contents: none
    uses: Jack20001413/github-workflow-templates/.github/workflows/deploy-azure-webapp.yaml@main
    with:
      web-app-name: ${{ vars.WEB_APP_NAME }}
      environment: 'DEV'
      package-name: 'dotnet-app'
      package-path: "."
    needs:
      - build
      - test
    secrets: inherit
